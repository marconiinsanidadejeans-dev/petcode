<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetCode - Resgate Seguro</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 10px; }
        p { color: #7f8c8d; font-size: 14px; margin-bottom: 25px; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0 16px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { background-color: #27ae60; color: white; padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; transition: background 0.3s; }
        button:hover { background-color: #219653; }
        .hidden { display: none; }
        .pet-photo { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; margin-bottom: 15px; border: 3px solid #27ae60; }
    </style>
</head>
<body>

    <div class="container">
        <div id="loading">A carregar PetCode...</div>
    </div>

    <!-- Importar o Firebase SDK via CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, child, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Configuração do novo projeto limpo
        const firebaseConfig = {
            apiKey: "AIzaSyBEkVQp4859CH_ZbmWGmwj7Rb5P8y9n4",
            authDomain: "petcodefree.firebaseapp.com",
            databaseURL: "https://petcodefree-default-rtdb.firebaseio.com",
            projectId: "petcodefree",
            storageBucket: "petcodefree.appspot.com",
            messagingSenderId: "544737012097",
            appId: "1:544737012097:web:344edfb26f2d9983afe888"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const tagId = urlParams.get('id');
        const container = document.querySelector('.container');

        async function initApp() {
            if (!tagId) {
                container.innerHTML = `
                    <h2>Ativar Novo PetCode</h2>
                    <p>Esta fivela ainda não está associada a nenhum pet. Preencha os dados abaixo para registar:</p>
                    <input type="text" id="petName" placeholder="Nome do Pet">
                    <input type="text" id="ownerName" placeholder="Nome do Tutor">
                    <input type="text" id="ownerPhone" placeholder="Telefone / WhatsApp (com DDD)">
                    <textarea id="petNotes" placeholder="Observações (ex: Alérgico a ração X, toma remédio)"></textarea>
                    <button onclick="activateTag()">Ativar Fivela</button>
                `;
                return;
            }

            try {
                const dbRef = ref(db);
                const snapshot = await get(child(dbRef, `pets/${tagId}`));
                
                if (snapshot.exists()) {
                    const pet = snapshot.val();
                    container.innerHTML = `
                        <h2>${pet.petName}</h2>
                        <p>Olá! Encontrou o meu pet? Por favor, entre em contato com o meu tutor.</p>
                        <p style="text-align: left; background: #f9f9f9; padding: 12px; border-radius: 6px;">
                            <strong>Tutor:</strong> ${pet.ownerName}<br>
                            <strong>Observações:</strong> ${pet.petNotes || 'Nenhuma'}
                        </p>
                        <button onclick="sendSecureMessage()">Enviar Mensagem ao Tutor</button>
                        <input type="text" id="msg-finder" placeholder="Escreva sua mensagem aqui..." style="margin-top: 15px;">
                    `;
                } else {
                    container.innerHTML = `
                        <h2>Fivela Não Ativada</h2>
                        <p>Esta fivela (ID: ${tagId}) ainda não foi configurada. Deseja ativá-la agora?</p>
                        <button onclick="window.location.href='?id=${tagId}'">Ativar Agora</button>
                    `;
                }
            } catch (error) {
                container.innerHTML = `<h2>Erro</h2><p>Não foi possível carregar os dados.</p>`;
            }
        }

        window.activateTag = async function() {
            const petName = document.getElementById('petName').value;
            const ownerName = document.getElementById('ownerName').value;
            const ownerPhone = document.getElementById('ownerPhone').value;
            const petNotes = document.getElementById('petNotes').value;

            if (!petName || !ownerName || !ownerPhone) {
                alert('Por favor, preencha o nome do pet, o seu nome e o telefone.');
                return;
            }

            try {
                await set(ref(db, `pets/` + tagId), {
                    petName,
                    ownerName,
                    ownerPhone,
                    petNotes,
                    createdAt: Date.now()
                });
                alert('PetCode ativado com sucesso para o ' + petName + '!');
                location.reload();
            } catch (error) {
                alert('Erro ao salvar: ' + error.message);
            }
        };

        window.sendSecureMessage = async function() {
            const mensagem = document.getElementById('msg-finder').value;
            if (!mensagem) {
                alert('Por favor, escreva uma mensagem antes de enviar.');
                return;
            }

            const tagRef = ref(db, `pets/` + tagId);
            const snapshot = await get(tagRef);
            if (snapshot.exists()) {
                const data = snapshot.val();
                const urlWa = `https://wa.me/55${data.ownerPhone.replace(/\D/g,'')}?text=Olá!%20Encontei%20o(a)%20${encodeURIComponent(data.petName)}.%20Mensagem:%20${encodeURIComponent(mensagem)}`;
                window.location.href = urlWa;
            }
        };

        initApp();
    </script>
</body>
</html>
